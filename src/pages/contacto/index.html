<div class="container text-center contactForm">
  <div class="row">
    <div class="col-md-6 offset-md-3 mt-5">
      <div class="card">
        <h5 class="card-header">Contacto</h5>
        <div class="card-body">
          <form id="contactForm" class="px-5">
            <div id="msj-error" class="mb-3"></div>
            <div class="mb-3">
              <input type="text" id="name" class="form-control" placeholder="Nombre" required />
            </div>
            <div class="mb-3">
              <div class="input-group">
                <input type="email" id="email" class="form-control" placeholder="Correo" required />
              </div>
            </div>
            <div class="mb-3">
              <div class="input-group">
                <textarea id="message" class="form-control" placeholder="Mensaje" rows="4" required> </textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
