        <span>→</span>
        <div class="date-input">
          <input type="date" id="dateEnd" value="">
        </div>
      </div>

      <button type="button" class="btn-filter" id="btnApplyFilters">
        <i class="bi bi-funnel"></i>
        Aplicar filtros
      </button>

    </div>

  </section>
